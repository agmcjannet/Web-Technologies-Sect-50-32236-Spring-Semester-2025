<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml">
  <head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <title>HW14 Babylon Shapes</title>

    <style>
      html, body {
        overflow: hidden;
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
      }

      #renderCanvas {
        width: 100%;
        height: 100%;
        touch-action: none;
      }
    </style>

    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    <script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>
    <script src="https://code.jquery.com/pep/0.4.3/pep.js"></script>
  </head>

  <body>
    <canvas id="renderCanvas" touch-action="none"></canvas>

    <script>
      const canvas = document.getElementById("renderCanvas");
      const engine = new BABYLON.Engine(canvas, true);

      const createScene = function () {
        const scene = new BABYLON.Scene(engine);

        const camera = new BABYLON.FreeCamera("camera1", new BABYLON.Vector3(0, 5, -10), scene);
        camera.setTarget(BABYLON.Vector3.Zero());
        camera.attachControl(canvas, true);

        const light = new BABYLON.HemisphericLight("light", new BABYLON.Vector3(0, 1, 0), scene);
        light.intensity = 0.7;

        const sphere = BABYLON.MeshBuilder.CreateSphere("sphere", { diameter: 2, segments: 50 }, scene);
        sphere.position.x = -2;
        sphere.position.y = 1;

        const sphereMaterial = new BABYLON.StandardMaterial("sphereMat", scene);
        sphereMaterial.diffuseColor = new BABYLON.Color3(1, 0, 0);
        sphere.material = sphereMaterial;

        const box = BABYLON.MeshBuilder.CreateBox("box", { size: 1 }, scene);
        box.position.x = 3;
        box.position.y = 2;

        const boxMaterial = new BABYLON.StandardMaterial("boxMat", scene);
        boxMaterial.diffuseColor = new BABYLON.Color3(0, 1, 0);
        box.material = boxMaterial;

        const cylinder = BABYLON.MeshBuilder.CreateCylinder("cylinder", { diameterTop: 1, diameterBottom: 2, height: 2 }, scene);
        cylinder.position.x = 0;
        cylinder.position.y = 3;

        const cylinderMaterial = new BABYLON.StandardMaterial("cylinderMat", scene);
        cylinderMaterial.diffuseColor = new BABYLON.Color3(0, 0, 1);
        cylinder.material = cylinderMaterial;

        const torus = BABYLON.MeshBuilder.CreateTorus("torus", { diameter: 2, thickness: 0.5 }, scene);
        torus.position.x = 2;
        torus.position.y = 0.5;

        const torusMaterial = new BABYLON.StandardMaterial("torusMat", scene);
        torusMaterial.diffuseColor = new BABYLON.Color3(1, 1, 0);
        torus.material = torusMaterial;

        const plane = BABYLON.MeshBuilder.CreatePlane("plane", { size: 5 }, scene);
        plane.rotation.x = Math.PI / 2;
        plane.position.y = -2;

        const planeMaterial = new BABYLON.StandardMaterial("planeMat", scene);
        planeMaterial.diffuseColor = new BABYLON.Color3(0.5, 0, 0.2);
        plane.material = planeMaterial;

        const cone = BABYLON.MeshBuilder.CreateCylinder("cone", { diameterTop: 0, diameterBottom: 1, height: 1 }, scene);
        cone.position.x = 0;
        cone.position.y = 0.5;

        const coneMaterial = new BABYLON.StandardMaterial("coneMat", scene);
        coneMaterial.diffuseColor = new BABYLON.Color3(0, 1, 1);
        cone.material = coneMaterial;

        scene.registerBeforeRender(function () {
          sphere.rotation.y += 0.01;
          box.rotation.x += 0.01;
          cylinder.rotation.z += 0.01;
          torus.rotation.y += 0.02;
          cone.rotation.x += 0.02;
        });

        return scene;
      };

      const scene = createScene();

      engine.runRenderLoop(function () {
        scene.render();
      });

      window.addEventListener("resize", function () {
        engine.resize();
      });
    </script>
  </body>
</html>
