<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Three.js Homework</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <style>
        body { margin: 0; overflow: hidden; }
    </style>
</head>
<body>
    <script>
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xe6c9e1); 

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 2, 5); 

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true; 
        controls.dampingFactor = 0.05;
        controls.screenSpacePanning = false;


        const geometry1 = new THREE.BoxGeometry();
        const material1 = new THREE.MeshStandardMaterial({ color: 0xff66cc }); 
        const cube = new THREE.Mesh(geometry1, material1);
        cube.position.x = -2;
        scene.add(cube);

        const geometry2 = new THREE.ConeGeometry(0.75, 1.5, 32);
        const material2 = new THREE.MeshStandardMaterial({ color: 0x00ffff });
        const cone = new THREE.Mesh(geometry2, material2);
        cone.rotation.set(Math.PI / 6, Math.PI / 6, 0); 
        cone.position.set(0, 2.5, 0);
        scene.add(cone);

        const geometry3 = new THREE.TorusGeometry(1, 0.3, 16, 100);
        const material3 = new THREE.MeshStandardMaterial({ color: 0x8a2be2 });
        const torus = new THREE.Mesh(geometry3, material3);
        torus.position.x = 2;
        scene.add(torus);

        const light = new THREE.DirectionalLight(0xffffff, 1);
        light.position.set(2, 2, 5);
        scene.add(light);

        const loader = new THREE.GLTFLoader();
        loader.load(
            'https://threejs.org/examples/models/gltf/RobotExpressive/RobotExpressive.glb',
            function (gltf) {
                const model = gltf.scene;
                model.scale.set(0.5, 0.5, 0.5);
                model.position.set(0, -1.5, 0);
                scene.add(model);

                model.rotation.y = 0;
                function rotateRobot() {
                    model.rotation.y += 0.01;
                }
                animateRobot = rotateRobot;
            }

        );


        function animate() {
            requestAnimationFrame(animate);
            cube.rotation.x += 0.01;
            cube.rotation.y += 0.01;
            cone.rotation.x += 0.01; 
            cone.rotation.y += 0.005;
            torus.rotation.x += 0.01;
            torus.rotation.y += 0.01;
            if (typeof animateRobot === "function") animateRobot();

            controls.update();
            renderer.render(scene, camera);
        }
        animate();

    </script>
</body>
</html>
