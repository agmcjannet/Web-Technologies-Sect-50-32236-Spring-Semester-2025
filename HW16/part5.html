<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>Final Project - Further Developed Game Part5 </title>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.11.0/dist/phaser.js"></script>
    <style type="text/css">
        body {
            margin: 0;
        }
    </style>
</head>

<body>

    <script type="text/javascript">

        var config = {
            type: Phaser.AUTO,
            width: 800,
            height: 600,
            physics: {
                default: 'arcade',
                arcade: {
                    gravity: { y: 300 },
                    debug: false
                }
            },
            scene: {
                preload: preload,
                create: create,
                update: update
            }
        };

        var player;
        var stars;
        var bombs;
        var apples;
        var strawberryCakes;
        var platforms;
        var cursors;
        var spikes;
        var score = 0;
        let level = 1;
        let levelText;
        var gameOver = false;
        var scoreText;
        var planes;
        var health = 3;
        var healthText;
        var hearts;




        var game = new Phaser.Game(config);

        function preload() {
            this.load.audio('backgroundMusic', 'coffee-lofi-chill-lofi-music-332738.mp3');
            this.load.image('sky', 'https://raw.githubusercontent.com/Montana-Media-Arts/441-WebTech-Spring2022-Examples/c3b2929369b05cce58e6ac0dfbe395f61c808491/Week%2013/assets/assets/sky.png');
            this.load.image('ground', 'https://raw.githubusercontent.com/Montana-Media-Arts/441-WebTech-Spring2022-Examples/c3b2929369b05cce58e6ac0dfbe395f61c808491/Week%2013/assets/assets/platform.png');
            this.load.image('star', 'https://raw.githubusercontent.com/Montana-Media-Arts/441-WebTech-Spring2022-Examples/c3b2929369b05cce58e6ac0dfbe395f61c808491/Week%2013/assets/assets/star.png');
            this.load.image('bomb', 'https://raw.githubusercontent.com/Montana-Media-Arts/441-WebTech-Spring2022-Examples/c3b2929369b05cce58e6ac0dfbe395f61c808491/Week%2013/assets/assets/bomb.png');
            this.load.image('spike', 'https://raw.githubusercontent.com/phaserjs/examples/39b154ad356a7ba666b216c0239d48b93fdff06e/public/assets/sprites/spikedball.png');
            this.load.image('apple', 'https://raw.githubusercontent.com/phaserjs/examples/39b154ad356a7ba666b216c0239d48b93fdff06e/public/assets/sprites/apple.png');
            this.load.image('strawberry-cake', 'https://raw.githubusercontent.com/phaserjs/examples/39b154ad356a7ba666b216c0239d48b93fdff06e/public/assets/sprites/strawberry-cake.png');
            this.load.spritesheet('dude', 'https://raw.githubusercontent.com/Montana-Media-Arts/441-WebTech-Spring2022-Examples/c3b2929369b05cce58e6ac0dfbe395f61c808491/Week%2013/assets/assets/dude.png', { frameWidth: 32, frameHeight: 48 });
            this.load.image('plane', 'https://raw.githubusercontent.com/phaserjs/examples/master/public/assets/sprites/plane.png');
            this.load.image('heart', 'https://raw.githubusercontent.com/phaserjs/examples/master/public/assets/sprites/heart.png');
        }

        function create() {
            this.add.image(400, 300, 'sky');

            // The platforms group contains the ground and the 2 (now 6) ledges we can jump on
            platforms = this.physics.add.staticGroup();

            // Create the ground
            platforms.create(400, 568, 'ground').setScale(2).refreshBody();

            // Create ledges
            platforms.create(600, 450, 'ground').setScale(0.3, 1).refreshBody();
            platforms.create(200, 400, 'ground').setScale(0.6, 1).refreshBody();
            platforms.create(750, 300, 'ground').setScale(0.3, 1).refreshBody();
            platforms.create(50, 250, 'ground').setScale(0.4, 1).refreshBody();
            platforms.create(625, 200, 'ground').setScale(0.2, 1).refreshBody();
            platforms.create(400, 150, 'ground').setScale(0.3, 1).refreshBody();

            // The player and its settings
            player = this.physics.add.sprite(100, 450, 'dude');
            player.setBounce(0.1);
            player.setCollideWorldBounds(true);

            planes = this.physics.add.group();
            spawnPlane(this);

            if (level % 2 === 1) { // Only if the level is odd: 1, 3, 5...
                hearts = this.physics.add.group({
                    key: 'heart',
                    repeat: 0,
                    setXY: { x: 75, y: 0, stepX: 400 }
                });

                hearts.children.iterate(function (heart) {
                    heart.setBounce(0.4);
                    heart.setGravityY(300);
                    heart.setScale(0.5);
                });


            }



            // Player animations
            this.anims.create({
                key: 'left',
                frames: this.anims.generateFrameNumbers('dude', { start: 0, end: 3 }),
                frameRate: 10,
                repeat: -1
            });

            this.anims.create({
                key: 'turn',
                frames: [{ key: 'dude', frame: 4 }],
                frameRate: 20
            });

            this.anims.create({
                key: 'right',
                frames: this.anims.generateFrameNumbers('dude', { start: 5, end: 8 }),
                frameRate: 10,
                repeat: -1
            });

            // Input events
            cursors = this.input.keyboard.createCursorKeys();

            // Stars to collect
            stars = this.physics.add.group({
                key: 'star',
                repeat: 6,
                setXY: { x: 12, y: 0, stepX: 70 }
            });

            stars.children.iterate(function (child) {
                child.setBounceY(Phaser.Math.FloatBetween(0.4, 0.8));
                var randomGravity = Phaser.Math.FloatBetween(100, 500);
                child.setGravityY(randomGravity);
            });

            // Apples to collect
            apples = this.physics.add.group({
                key: 'apple',
                repeat: 3,
                setXY: { x: 12, y: 0, stepX: 150 }
            });

            apples.children.iterate(function (child) {
                child.setBounceY(Phaser.Math.FloatBetween(0.4, 0.8));
                var randomGravity = Phaser.Math.FloatBetween(100, 500);
                child.setGravityY(randomGravity);
                child.setScale(0.7);  // Make apples smaller
            });

            // Strawberry Cakes to collect
            strawberryCakes = this.physics.add.group({
                key: 'strawberry-cake',
                repeat: 1,
                setXY: { x: 12, y: 0, stepX: 300 }
            });

            strawberryCakes.children.iterate(function (child) {
                child.setBounceY(Phaser.Math.FloatBetween(0.4, 0.8));
                var randomGravity = Phaser.Math.FloatBetween(100, 500);
                child.setGravityY(randomGravity);
                child.setScale(0.33);
            });

            bombs = this.physics.add.group();

            spikes = this.physics.add.group({
                key: 'spike',
                repeat: 2,
                setXY: { x: 300, y: 0, stepX: 200 }
            });

            spikes.children.iterate(function (spike) {
                spike.setBounce(0.2);
                spike.setGravityY(300);
                spike.setScale(0.5);
            });

            // Collect spike x positions
            let spikePositions = [];
            spikes.children.iterate(function (spike) {
                spikePositions.push(spike.x);
            });

            // The score
            scoreText = this.add.text(16, 50, 'Score: 0', { fontSize: '32px', fill: '#000' });

            levelText = this.add.text(16, 10, 'Level: ' + level, { fontSize: '32px', fill: '#FFF' });

            healthText = this.add.text(600, 50, 'Health: ' + health, { fontSize: '28px', fill: '#f00' });


            // Collisions
            this.physics.add.collider(player, platforms);
            this.physics.add.collider(stars, platforms);
            this.physics.add.collider(apples, platforms);
            this.physics.add.collider(strawberryCakes, platforms);
            this.physics.add.collider(bombs, platforms);
            this.physics.add.collider(spikes, platforms);

            this.physics.add.overlap(player, stars, collectStar, null, this);
            this.physics.add.overlap(player, apples, collectApple, null, this);
            this.physics.add.overlap(player, strawberryCakes, collectStrawberryCake, null, this);
            this.physics.add.collider(player, bombs, hitBomb, null, this);
            this.physics.add.collider(player, spikes, hitSpike, null, this);
            this.physics.add.collider(player, planes, hitPlane, null, this);

            this.physics.add.collider(hearts, platforms);
            this.physics.add.overlap(player, hearts, collectHeart, null, this);



            // Make sure items don't fall on spikes
            stars.children.iterate(function (star) {
                let xPos;
                do {
                    xPos = Phaser.Math.Between(0, 800);
                } while (isStarTooCloseToSpikes(xPos, spikePositions));

                star.setX(xPos);
            });

            apples.children.iterate(function (apple) {
                let xPos;
                do {
                    xPos = Phaser.Math.Between(0, 800);
                } while (isStarTooCloseToSpikes(xPos, spikePositions));

                apple.setX(xPos);
            });

            strawberryCakes.children.iterate(function (cake) {
                let xPos;
                do {
                    xPos = Phaser.Math.Between(0, 800);
                } while (isStarTooCloseToSpikes(xPos, spikePositions));

                cake.setX(xPos);
            });
            // Add background music and set it to loop
            var backgroundMusic = this.sound.add('backgroundMusic', {
                loop: true,
                volume: 0.5  // Adjust volume as needed
            });

            // Play the background music
            backgroundMusic.play();
        }

        // Check if the item is too close to any of the spikes, use buffer
        function isStarTooCloseToSpikes(itemX, spikePositions) {
            const buffer = 50;
            for (let i = 0; i < spikePositions.length; i++) {
                if (Math.abs(itemX - spikePositions[i]) < buffer) {
                    return true;
                }
            }
            return false;
        }
        let planeSpawnCooldown = false;

        function spawnPlane(scene) {
            if (planeSpawnCooldown) return;

            planeSpawnCooldown = true;
            setTimeout(() => {
                planeSpawnCooldown = false;
            }, 2000);  // Delay next plane spawn by 2 seconds

            const plane = scene.physics.add.sprite(-100, 100, 'plane');
            plane.setVelocity(150);
            plane.setGravityY(0);
            plane.setScale(1.5);
            planes.add(plane);

            scene.tweens.add({
                targets: plane,
                x: 900,
                duration: 5000,
                ease: 'Linear',
                onComplete: function () {
                    plane.destroy();
                    spawnPlane(scene);
                }
            });
        }



        function update() {
            if (gameOver) {
                return;
            }

            // Player movement
            if (cursors.left.isDown) {
                player.setVelocityX(-160);
                player.anims.play('left', true);
            }
            else if (cursors.right.isDown) {
                player.setVelocityX(160);
                player.anims.play('right', true);
            }
            else {
                player.setVelocityX(0);
                player.anims.play('turn');
            }

            // Player jump
            if (cursors.space.isDown && player.body.touching.down) {
                player.setVelocityY(-330);
            }

            planes.getChildren().forEach(function (plane) {
                if (plane.x > 850) {
                    plane.destroy();
                    spawnPlane(this);
                }
            }, this);

        }

        function collectStar(player, star) {
            star.disableBody(true, true);

            // Add and update the score
            score += 10;
            scoreText.setText('Score: ' + score);

            // Check if all items have been collected
            if (stars.countActive(true) === 0 && apples.countActive(true) === 0 && strawberryCakes.countActive(true) === 0) {
                // Fade out
                this.cameras.main.fadeOut(1000, 0, 0, 0);

                this.time.delayedCall(2000, function () {
                    level++;
                    levelText.setText('Level: ' + level);
                    respawnItems();

                    // Fade in
                    this.cameras.main.fadeIn(2000, 0, 0, 0);
                }, [], this);
            }
        }






        function collectApple(player, apple) {
            apple.disableBody(true, true);

            // Add and update the score
            score += 5;
            scoreText.setText('Score: ' + score);


            if (stars.countActive(true) === 0 && apples.countActive(true) === 0 && strawberryCakes.countActive(true) === 0) {
                respawnItems();
            }
        }

        function collectStrawberryCake(player, cake) {
            cake.disableBody(true, true);

            // Add and update the score
            score += 20;
            scoreText.setText('Score: ' + score);

            if (stars.countActive(true) === 0 && apples.countActive(true) === 0 && strawberryCakes.countActive(true) === 0) {
                respawnItems();
            }
        }

        // Respawn all items (stars, apples, and cakes)
        function respawnItems() {
            stars.children.iterate(function (child) {
                child.enableBody(true, child.x, 0, true, true);
            });

            apples.children.iterate(function (child) {
                child.enableBody(true, child.x, 0, true, true);
            });

            strawberryCakes.children.iterate(function (child) {
                child.enableBody(true, child.x, 0, true, true);
            });
            var x = (player.x < 400) ? Phaser.Math.Between(400, 800) : Phaser.Math.Between(0, 400);

            var bomb = bombs.create(x, 16, 'bomb');
            bomb.setBounce(1);
            bomb.setCollideWorldBounds(true);
            bomb.setVelocity(Phaser.Math.Between(-200, 200), 20);
            bomb.allowGravity = false;

        }

        function collectHeart(player, heart) {
            heart.disableBody(true, true);

            if (health < 4) {
                health += 1;
                healthText.setText('Health: ' + health);
            }
        }



        function hitBomb(player, bomb) {
            if (!player.invulnerable) {
                health -= 1;
                healthText.setText('Health: ' + health);

                player.invulnerable = true;
                player.setTint(0xff0000); // red flash

                player.scene.time.delayedCall(1000, () => {
                    player.invulnerable = false;
                    player.clearTint();
                });

                if (health <= 0) {
                    player.setTint(0x000000);
                    player.anims.play('turn');
                    player.scene.physics.pause();
                    gameOver = true;
                }
            }
        }

        function hitSpike(player, spike) {
            if (!player.invulnerable) {
                health -= 1;
                healthText.setText('Health: ' + health);

                player.invulnerable = true;
                player.setTint(0xff0000); // red flash

                player.scene.time.delayedCall(1000, () => {
                    player.invulnerable = false;
                    player.clearTint();
                });

                if (health <= 0) {
                    player.setTint(0x000000);
                    player.anims.play('turn');
                    player.scene.physics.pause();
                    gameOver = true;
                }
            }
        }


        function hitPlane(player, plane) {
            if (!player.invulnerable) {
                health -= 1;
                healthText.setText('Health: ' + health);

                player.invulnerable = true;
                player.setTint(0xff0000); // red flash

                player.scene.time.delayedCall(1000, () => {
                    player.invulnerable = false;
                    player.clearTint();
                });

                if (health <= 0) {
                    player.setTint(0x000000);
                    player.anims.play('turn');
                    player.scene.physics.pause();
                    gameOver = true;
                }
            }
        }

        function decreaseHealth() {
            health--;
            healthText.setText('Health: ' + health);

            if (health <= 0) {
                gameOver = true;
                player.setTint(0xff0000);
                player.anims.play('turn');
            }
        }


    </script>

</body>

</html>
